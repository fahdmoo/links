<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F3hd Mohamed Saeed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0b0b14;color:#fff;min-height:100vh;padding:20px;display:flex;justify-content:center}
.wrap{width:100%;max-width:420px}
.top{text-align:center;padding:20px 10px}
.top img{width:140px;height:140px;border-radius:50%;object-fit:cover;border:4px solid #a855f7;cursor:pointer}
.top h1{font-size:26px;margin-top:12px}
.top .welcome{color:#fff;font-weight:bold;margin-top:10px;font-size:22px}
.top .welcome2{color:#a855f7;font-weight:bold;margin-top:5px;font-size:17px}
.card{background:#1a1a2e;border:1px solid #333;border-radius:18px;padding:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card b{font-size:18px}
.card small{color:#aaa;display:block;margin-top:2px;word-break:break-all}
.btns{display:flex;gap:6px}
.btns button,.btns a{border:0;cursor:pointer;text-decoration:none;font-weight:bold;font-size:13px;padding:9px 11px;border-radius:10px;color:#fff;background:#2a2a45}
.btns .open{background:#a855f7}
.btns .copy{background:#333}
.btns .qr{background:#fff;color:#000}
.qr-box{background:#1e1533;border:1.5px dashed #a855f7;border-radius:18px;padding:22px 20px;text-align:center;margin-top:18px}
.qr-box img{width:150px;height:150px;background:#fff;padding:8px;border-radius:12px;display:block;margin:0 auto 30px auto}
.qr-box button{background:#a855f7;color:#fff;border:0;padding:13px 28px;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;display:block;margin:0 auto}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);align-items:center;justify-content:center;flex-direction:column;z-index:99;padding:20px}
#modal img{max-width:90%;max-height:75vh;border-radius:15px}
#modal button{margin-top:15px;background:#a855f7;color:#fff;border:0;padding:12px 25px;border-radius:12px;font-weight:bold;cursor:pointer}
#qrModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);align-items:center;justify-content:center;flex-direction:column;z-index:99}
#qrModal img{width:240px;height:240px;background:#fff;padding:10px;border-radius:15px}
#qrModal p{margin:12px 0;color:#fff;font-weight:bold}
#qrModal button{background:#a855f7;color:#fff;border:0;padding:12px 25px;border-radius:12px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<img id="myImg" src="me.jpeg">
<h1>F3hd Mohamed Saeed</h1>
<div class="welcome">Welcome 🥷</div>
<div class="welcome2">Welcome to Fahd's Kingdom</div>
</div>

<div id="list"></div>

<div class="qr-box">
<img id="mainQR" src="">
<button onclick="copyMain()">Copy My Link</button>
</div>
</div>

<div id="modal" onclick="closeModal()">
<img id="bigImg" src="me.jpeg">
<button>Close</button>
</div>

<div id="qrModal" onclick="closeQR()">
<img id="qrImg" src="">
<p id="qrName"></p>
<button>Close</button>
</div>

<script>
const MY_LINKS = {
  "FAROS Company": "https://fahdmoo.github.io/FAROS",
  "Facebook": "https://facebook.com/fahd.m.gadallah",
  "Messenger": "https://m.me/fahd.m.gadallah",
  "Instagram": "https://instagram.com/fahd.m.gadallah",
  "Threads": "https://www.threads.net/@fahd.m.gadallah",
  "Snapchat": "https://www.snapchat.com/add/xjadallahx",
  "TikTok": "https://www.tiktok.com/@fahd_m_gadalla",
  "WhatsApp": "https://wa.me/201066895496",
  "Telegram": "https://t.me/x_jad3llah_x"
};
const MY_SITE_LINK = "https://f3hd.com";

const list = document.getElementById('list');
for(let name in MY_LINKS){
  let link = MY_LINKS[name];
  let div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `<div><b>${name}</b><small>${link}</small></div>
  <div class="btns">
    <a class="open" href="${link}" target="_blank">Open</a>
    <button class="copy" onclick="copyLink('${link}')">Copy</button>
    <button class="qr" onclick="showQR('${name}','${link}')">QR</button>
  </div>`;
  list.appendChild(div);
}
document.getElementById('mainQR').src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(MY_SITE_LINK);

function copyLink(l){ navigator.clipboard.writeText(l); alert("Copied"); }
function copyMain(){ navigator.clipboard.writeText(MY_SITE_LINK); alert("Link Copied"); }
function showQR(n,l){ document.getElementById('qrImg').src = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(l); document.getElementById('qrName').innerText = n; document.getElementById('qrModal').style.display='flex'; }
function closeQR(){ document.getElementById('qrModal').style.display='none'; }
document.getElementById('myImg').onclick = function(){ document.getElementById('bigImg').src = this.src; document.getElementById('modal').style.display='flex'; }
function closeModal(){ document.getElementById('modal').style.display='none'; }
</script>
</body>
</html>
